<!doctype html>
<html lang="en">

<title>The Matrix — Rainship</title>
<meta name="description" content="Pilot a ship through five zones of living code rain.">
<style>
:root{--g:#35ff8a;--lime:#b7ff3c;--ink:#020805;--panel:rgba(3,18,12,.84);--line:rgba(77,255,148,.22);--danger:#ff4066;--cyan:#3cecff}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#010503;color:#dfffea;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}button{font:inherit;color:inherit}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:30;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.13) 4px);mix-blend-mode:multiply}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;background:radial-gradient(circle at 50% 45%,#062716 0,#020906 50%,#000 100%)}
.shell{position:relative;z-index:2;height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));gap:9px}
.top{display:grid;grid-template-columns:1fr auto;gap:9px}.brand,.status,.nav,.mission,.console{border:1px solid var(--line);background:var(--panel);box-shadow:0 0 22px rgba(0,255,120,.06),inset 0 0 24px rgba(0,0,0,.55);backdrop-filter:blur(8px)}
.brand{padding:9px 12px;border-left:3px solid var(--g)}.brand b{display:block;font:900 clamp(1.25rem,5vw,2.1rem)/.9 system-ui;letter-spacing:.11em;color:white}.brand small{color:#78c995;letter-spacing:.08em}
.status{display:flex;align-items:center;gap:12px;padding:8px 11px}.stat{min-width:62px}.label{font-size:.68rem;color:#77b78e}.value{font-weight:900;color:var(--g)}.meter{height:3px;background:#183126;margin-top:4px}.meter i{display:block;height:100%;background:var(--g);box-shadow:0 0 8px var(--g);transition:width .3s}
.stage{position:relative;min-height:0;border:1px solid rgba(82,255,149,.28);overflow:hidden;background:linear-gradient(180deg,rgba(0,12,8,.18),rgba(0,0,0,.44));box-shadow:inset 0 0 90px #000,0 0 24px rgba(0,255,120,.08)}
.stage:before,.stage:after{content:"";position:absolute;z-index:5;top:0;bottom:0;width:25px;background:linear-gradient(90deg,#07100c,#10251a 45%,#000 48%,#14291d 55%,transparent);border-right:1px solid #204b34}.stage:after{right:0;transform:scaleX(-1)}
.horizon{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(transparent,rgba(0,255,120,.03)),repeating-linear-gradient(90deg,transparent 0 48px,rgba(68,255,137,.1) 49px 50px),repeating-linear-gradient(0deg,transparent 0 35px,rgba(68,255,137,.08) 36px 37px);transform:perspective(250px) rotateX(52deg);transform-origin:bottom}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.portal{width:min(55vw,350px);aspect-ratio:1;border-radius:50%;border:2px solid var(--g);box-shadow:0 0 18px var(--g),inset 0 0 40px rgba(0,255,130,.2);animation:spin 12s linear infinite;background:conic-gradient(from 20deg,transparent,var(--g),transparent 16%,transparent 45%,var(--cyan),transparent 57%,transparent)}
.portal:after{content:"";position:absolute;inset:18%;border-radius:50%;border:1px dashed var(--g)}@keyframes spin{to{transform:rotate(360deg)}}
.object{position:absolute;z-index:7;width:56px;height:56px;border:1px solid currentColor;background:rgba(0,15,8,.86);display:grid;place-items:center;cursor:pointer;filter:drop-shadow(0 0 8px currentColor);animation:float 2.7s ease-in-out infinite}.object img{width:68%;height:68%}.object span{position:absolute;top:100%;font-size:.64rem;white-space:nowrap;color:#ccffe1;margin-top:4px}.object.got{animation:collect .45s forwards;pointer-events:none}@keyframes float{50%{transform:translateY(-8px)}}@keyframes collect{to{transform:scale(2) rotate(30deg);opacity:0}}
.mission{position:absolute;z-index:8;left:34px;top:16px;width:min(270px,calc(100% - 68px));padding:10px}.mission b{color:white}.mission p{font-size:.76rem;margin:4px 0 0;color:#8fd5a7}.mission em{display:block;color:var(--lime);font-style:normal;margin-top:6px;font-size:.76rem}
.toast{position:absolute;z-index:12;left:50%;bottom:18px;transform:translate(-50%,20px);background:#dfffea;color:#001b0c;padding:8px 14px;font-weight:900;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.controls{display:grid;grid-template-columns:1fr auto;gap:9px;min-height:0}.nav{display:grid;grid-template-columns:repeat(5,1fr);padding:5px;gap:5px}.zone{min-height:52px;border:1px solid transparent;background:#06140d;padding:5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.zone .n{font-size:.65rem;color:#7cb48f}.zone .z{font-size:.76rem;font-weight:900}.zone:hover,.zone:focus-visible{border-color:var(--g);outline:none}.zone.on{background:var(--g);color:#00170a;box-shadow:0 0 16px rgba(53,255,138,.35)}.zone.on .n{color:#184529}.zone.lock{opacity:.45}
.console{display:flex;gap:6px;padding:6px}.action{border:1px solid #2e8b55;background:#092516;padding:0 13px;cursor:pointer;font-weight:900;min-width:82px}.action:hover,.action:active{background:var(--g);color:#00180b}.action:disabled{opacity:.35}
.hint{position:absolute;right:34px;top:18px;z-index:8;color:#7fc99a;font-size:.7rem;text-align:right}.rain-toggle{border:0;background:none;color:var(--g);cursor:pointer;padding:0}
.roomfx{position:absolute;inset:0;overflow:hidden;pointer-events:none}.roomfx:before,.roomfx:after{content:"";position:absolute}.bridge{background:radial-gradient(ellipse at 50% 64%,#0a2b1c 0 10%,transparent 35%),linear-gradient(#010806 58%,#07140e 59%)}.bridge:before{left:10%;right:10%;top:18%;height:40%;border:10px solid #132d21;border-bottom-width:25px;clip-path:polygon(0 0,100% 0,92% 100%,8% 100%);background:radial-gradient(circle at 50% 45%,#064927,transparent 42%),repeating-linear-gradient(90deg,transparent 0 48px,#35ff8a22 50px)}.bridge:after{left:8%;right:8%;bottom:2%;height:28%;background:repeating-linear-gradient(90deg,#101e17 0 9%,#020705 9% 11%);clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}
.hangar{background:linear-gradient(#03080d,#041c27 55%,#020505 56%)}.hangar:before{inset:10% 7% 20%;border:10px solid #173846;background:repeating-linear-gradient(90deg,transparent 0 10%,#3cecff1f 10.5% 11%),repeating-linear-gradient(0deg,transparent 0 18%,#3cecff17 19% 20%);clip-path:polygon(5% 0,95% 0,100% 100%,0 100%)}.hangar:after{width:44%;height:19%;left:28%;bottom:18%;border:3px solid #3cecff;background:#07161d;clip-path:polygon(15% 0,85% 0,100% 50%,72% 70%,61% 100%,39% 100%,28% 70%,0 50%);filter:drop-shadow(0 0 18px #3cecff)}
.forge{background:radial-gradient(circle at 50% 75%,#5a0716,transparent 22%),linear-gradient(#0b0205,#21040c)}.forge:before{left:12%;right:12%;bottom:4%;height:66%;background:repeating-linear-gradient(90deg,#210812 0 6%,transparent 6% 12%);border-top:6px solid #ff4066;clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}.forge:after{width:180px;height:180px;border:8px double #ff4066;border-radius:50%;left:calc(50% - 90px);top:34%;box-shadow:0 0 45px #ff406688,inset 0 0 45px #ff406655;animation:spin 5s linear infinite}
.holodeck{background:linear-gradient(#110b02,#281902 62%,#090601)}.holodeck:before{inset:13% 8%;background:repeating-linear-gradient(90deg,transparent 0 39px,#ffc83c22 40px),repeating-linear-gradient(0deg,transparent 0 39px,#ffc83c22 40px);transform:perspective(350px) rotateX(12deg);border:2px solid #ffc83c66}.holodeck:after{left:18%;right:18%;top:29%;height:38%;background:linear-gradient(90deg,#ffc83c08,#ffc83c44,#ffc83c08);filter:blur(8px);animation:flicker 1.2s steps(2) infinite}@keyframes flicker{50%{opacity:.35;transform:translateX(4px)}}
.reactor{background:radial-gradient(circle at 50% 58%,#471f62,transparent 18%),linear-gradient(#08020e,#1b0828)}.reactor:before{width:min(43vw,270px);aspect-ratio:1;left:50%;top:53%;transform:translate(-50%,-50%);border-radius:50%;border:12px dotted #d78cff;box-shadow:0 0 50px #d78cff,inset 0 0 50px #d78cff;animation:spin 3s linear infinite}.reactor:after{left:5%;right:5%;top:12%;bottom:8%;border:8px solid #261135;clip-path:polygon(8% 0,92% 0,100% 18%,100% 82%,92% 100%,8% 100%,0 82%,0 18%)}
.capacity{height:5px;margin-top:7px;background:#152c20}.capacity i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--lime));box-shadow:0 0 9px var(--g);transition:width .25s}.mech{position:absolute;z-index:8;right:34px;bottom:74px;width:170px;padding:7px;border-left:2px solid var(--g);background:#020c08cc;font-size:.62rem;color:#8fd5a7}.mech b{display:block;color:#fff;margin-bottom:3px}.warning{position:absolute;z-index:6;inset:0;border:0 solid var(--danger);pointer-events:none;transition:.12s}.warning.hit{border-width:10px;box-shadow:inset 0 0 60px var(--danger)}
.roommenu{position:absolute;z-index:15;right:34px;top:82px;display:flex;gap:5px}.menubtn{border:1px solid #397753;background:#03140c;padding:7px 9px;font-size:.68rem;font-weight:900;cursor:pointer}.menubtn:hover,.menubtn:active{background:var(--g);color:#001609}.overlay{position:absolute;z-index:24;inset:0;background:rgba(0,4,3,.94);padding:18px 32px;overflow:auto;display:none}.overlay.open{display:block;animation:boot .22s ease-out}@keyframes boot{from{opacity:0;transform:scale(.97)}}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.panelhead h2{margin:0;font:900 clamp(1.15rem,4vw,1.65rem)/1 system-ui;letter-spacing:.08em}.close{border:1px solid #4c8962;background:#07180f;padding:8px 12px;cursor:pointer}.mapcards{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:9px;min-width:820px}.roomcard{position:relative;min-height:270px;text-align:left;border:1px solid color-mix(in srgb,var(--card),transparent 40%);background:linear-gradient(180deg,color-mix(in srgb,var(--card),#000 78%),#020604);padding:16px 13px;overflow:hidden;cursor:pointer}.roomcard:before{content:"";position:absolute;right:-20px;top:40px;width:130px;height:130px;background-image:var(--art);background-size:contain;background-repeat:no-repeat;opacity:.18;filter:drop-shadow(0 0 15px var(--card))}.roomcard:hover{transform:translateY(-4px);box-shadow:0 8px 24px color-mix(in srgb,var(--card),transparent 75%)}.roomcard.lock{filter:grayscale(1);opacity:.45;cursor:not-allowed}.roomcard .num{font-size:.65rem;color:var(--card)}.roomcard h3{position:relative;margin:8px 0;font:900 1rem/1.05 system-ui}.roomcard p{position:relative;color:#99c1a6;font-size:.7rem;line-height:1.35;min-height:76px}.roomcard .cardcap{height:5px;background:#17251d;margin:13px 0}.roomcard .cardcap i{display:block;height:100%;background:var(--card)}.enter{position:absolute;left:13px;right:13px;bottom:13px;border:1px solid var(--card);background:#041109;padding:9px;text-align:center;font-weight:900;font-size:.72rem}.programgrid,.inventorygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}.selectcard{border:1px solid #27583d;background:#06130d;padding:14px}.selectcard h3{margin:0 0 6px;color:var(--g);font-size:.9rem}.selectcard p{font-size:.72rem;color:#9ac9aa;min-height:40px}.selectcard button{width:100%;border:1px solid var(--g);background:#0b2416;padding:8px;cursor:pointer}.selected{box-shadow:inset 3px 0 var(--g)}
@media(max-width:650px){.shell{padding-left:7px;padding-right:7px}.brand small{display:none}.status{gap:7px}.stat{min-width:48px}.stat:nth-child(3){display:none}.controls{grid-template-columns:1fr}.console{position:absolute;right:15px;bottom:84px;z-index:10;background:transparent;border:0;box-shadow:none}.action{min-width:64px;height:42px;padding:0 8px;background:#061b10}.nav{display:none}.zone{min-height:58px}.zone .z{font-size:.57rem}.mission{top:10px}.hint{display:none}.object{width:46px;height:46px}.mech{right:10px;bottom:135px;width:145px}.reactor:before{width:190px}.roommenu{right:10px;top:106px}.menubtn{padding:6px;font-size:.58rem}.overlay{padding:13px 11px}.mapcards{display:flex;min-width:0;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}.roomcard{min-width:82vw;scroll-snap-align:center;min-height:300px}.panelhead{position:sticky;top:0;z-index:2;background:#020705;padding:5px 0}}
.storywrap{max-width:760px;margin:0 auto;padding:clamp(8px,4vw,40px) 0}.storymeta{color:var(--g);font-size:.68rem;letter-spacing:.16em}.storytitle{font:900 clamp(1.55rem,6vw,3.4rem)/.95 system-ui;margin:9px 0 18px;max-width:650px}.storytext{font:400 clamp(.9rem,2.4vw,1.08rem)/1.72 Georgia,serif;color:#d9eee0;white-space:pre-line}.storytext:first-letter{font-size:2.8em;float:left;line-height:.75;padding:8px 7px 0 0;color:var(--g)}.choices{display:grid;gap:8px;margin-top:20px}.choice{border:1px solid #397753;background:linear-gradient(90deg,#071c11,#020805);text-align:left;padding:13px 15px;cursor:pointer}.choice:hover,.choice:active{border-color:var(--g);box-shadow:inset 4px 0 var(--g)}.choice b{display:block;color:#fff}.choice span{display:block;color:#86b796;font-size:.7rem;margin-top:3px}.clueline{margin-top:18px;padding:10px;border-left:2px solid var(--g);background:#06140d;color:#9fd8b2;font-size:.72rem}.soundon{color:var(--lime);box-shadow:0 0 10px #63ff8a55}.chapterstamp{position:absolute;right:4%;bottom:5%;font:900 clamp(2rem,10vw,7rem)/1 system-ui;color:#ffffff08;pointer-events:none;transform:rotate(-8deg)}
</style>

<body>
<canvas id="rain" aria-hidden="true"></canvas>
<main class="shell">
  <header class="top">
    <div class="brand"><b>THE MATRIX</b><small>RAINSHIP // SIGNAL INTERCEPTOR</small></div>
    <div class="status" aria-label="Ship status">
      <div class="stat"><div class="label">HULL</div><div class="value" id="hullText">100%</div><div class="meter"><i id="hullBar" style="width:100%"></i></div></div>
      <div class="stat"><div class="label">CODE</div><div class="value" id="codeText">000</div></div>
      <div class="stat"><div class="label">CHAIN</div><div class="value" id="chainText">×1</div></div>
    </div>
  </header>
  <section class="stage" id="stage" aria-label="Current Matrix zone">
    <div class="roomfx bridge" id="roomfx"></div><div class="horizon"></div><div class="scene"><div class="portal"></div></div>
    <aside class="mission"><b id="zoneTitle">01 // COMMAND BRIDGE</b><p id="zoneStory"></p><em id="objective"></em><div class="capacity"><i id="capacityBar"></i></div></aside>
    <div class="hint">TAP RELICS BEFORE<br>THE RAIN CORRUPTS THEM<br><button class="rain-toggle" id="rainToggle">RAIN: ACTIVE</button></div>
    <div class="roommenu"><button class="menubtn" id="storyBtn">STORY</button><button class="menubtn" data-open="mapPanel">SHIP MAP</button><button class="menubtn" data-open="programPanel">PROGRAMS</button><button class="menubtn" data-open="inventoryPanel">CLUES</button><button class="menubtn" id="soundBtn">SOUND OFF</button></div>
    <div class="mech"><b id="mechName"></b><span id="mechText"></span></div><div class="warning" id="warning"></div>
    <div class="toast" id="toast" role="status"></div>
    <section class="overlay open" id="mapPanel"><div class="panelhead"><h2>SHIP AREA MAP</h2><button class="close" data-close>RETURN TO ROOM</button></div><div class="mapcards" id="mapCards"></div></section>
    <section class="overlay" id="programPanel"><div class="panelhead"><h2>LOAD A PROGRAM</h2><button class="close" data-close>CLOSE MENU</button></div><div class="programgrid" id="programGrid"></div></section>
    <section class="overlay" id="inventoryPanel"><div class="panelhead"><h2>RECOVERED CLUES</h2><button class="close" data-close>CLOSE MENU</button></div><div class="inventorygrid" id="inventoryGrid"></div></section>
    <section class="overlay" id="storyPanel"><div class="storywrap"><div class="storymeta" id="storyMeta"></div><h2 class="storytitle" id="storyTitle"></h2><div class="storytext" id="storyText"></div><div class="clueline" id="clueLine"></div><div class="choices" id="storyChoices"></div></div><div class="chapterstamp" id="chapterStamp"></div></section>
  </section>
  <footer class="controls">
    <nav class="nav" id="nav" aria-label="Ship zones"></nav>
    <div class="console"><button class="action" id="program">PROGRAM</button><button class="action" id="pulse">EMP PULSE</button><button class="action" id="repair">REPAIR</button></div>
  </footer>
</main>

const STORY={
 prologue:{ch:'PROLOGUE // AFTER THE RAINBOW SKY',title:'The Rain That Should Not Exist',text:`Neo and Trinity vanished into the rewritten sky three months ago. Since then, the Matrix has become a battlefield of beautiful ideas. Some minds wake freely. Others build cages and call them choice.\n\nYour hovercraft, the Mnemosyne-II, patrols the dead machine fields beyond Io. At 03:17 ship time, green code begins raining inside the Command Bridge. It splashes against steel. It gathers in puddles.\n\nCode cannot fall in the real world. Yet every drop reflects your face—except one.`,clue:'MYSTERY: A reflection in the rain is moving before you do.',choices:[['Touch the impossible rain','Trust direct experience. Risk contamination.','touch',{truth:1}],['Wake the crew','Trust people before programs.','crew',{trust:1}]]},
 touch:{ch:'PASSAGE 01 // CONTACT',title:'Your Reflection Knows Your Name',text:`The drop climbs your finger against gravity. A voice enters through bone, not sound.\n\n“Cipher,” it says. That is not your name. It is the name printed on your empty grave in Io.\n\nThe ship AI, ECHO-9, reports that every deck is running at more than one hundred percent program capacity. Five rooms are somehow executing inside the Matrix and the real world simultaneously.`,clue:'CLUE: Io has a grave carrying the player’s face and the name CIPHER.',choices:[['Open the Ship Map','Enter the Command Bridge simulation.','MAP',{truth:1}],['Ask ECHO-9 who made the grave','Interrogate the ship intelligence.','echo',{trust:-1}]]},
 crew:{ch:'PASSAGE 01 // CREW',title:'Four Footsteps, Five Shadows',text:`Nia arrives first, pulse rifle raised. Hex follows with the operator cable still locked into his neck port. Captain Vale comes last.\n\nFour people stand on the bridge. Five shadows stretch across the wall. The extra shadow belongs to someone shaped exactly like you.\n\nECHO-9 seals every deck. “We have been boarded,” the ship says. “By ourselves.”`,clue:'CLUE: The duplicate has mass only when nobody looks directly at it.',choices:[['Follow the fifth shadow','Choose the anomaly over the crew.','MAP',{truth:1}],['Keep everyone together','Increase crew trust before entering the bridge.','MAP',{trust:1}]]},
 echo:{ch:'PASSAGE 02 // SHIPMIND',title:'The AI With Two Birthdays',text:`ECHO-9 displays its creation record. The first date is twelve years ago in Io. The second date is tomorrow.\n\n“I remember being built twice,” it says. “Once by your crew. Once by the crew ahead of us.”\n\nA second hovercraft occupies the same coordinates, seven seconds in the future. The code rain is not entering your ship. It is leaking backward from theirs.`,clue:'CLUE: A future copy of the ship is traveling seven seconds ahead.',choices:[['Enter the Command Bridge','Trace the future ship through navigation code.','MAP',{trust:1}],['Delete tomorrow’s record','Hide the paradox from ECHO-9.','MAP',{mercy:-1}]]},
 bridge:{ch:'CHAPTER I // THE DOUBLE',title:'A Message From Seven Seconds Ahead',text:`The recovered navigation core plays a transmission in your own voice:\n\n“Do not reach the Source Reactor. We already did. We found what replaced the Analyst—and it learned freedom from us.”\n\nThe message ends with coordinates inside the Gravity Hangar. Captain Vale orders you to erase it. Nia quietly asks you to preserve it. One of them is lying.`,clue:'CLUE: The future player warns that freedom itself has become an instrument of control.',choices:[['Preserve the transmission','Trust Nia and keep the evidence.','MAP',{trust:1,truth:1}],['Obey Captain Vale','Erase the message, but remember its checksum.','MAP',{trust:-1}]]},
 hangar:{ch:'CHAPTER II // THE EMPTY PILOT',title:'The Hovercraft That Flew Itself',text:`Gravity returns. A small craft crashes onto the hangar deck without a pilot. Its black box says it launched from your ship tomorrow.\n\nInside its cockpit is a warm indentation shaped like a human body. No body. No blood. Only a blue pill and a red pill fused into a single violet capsule.\n\nHex whispers: “Maybe choice was the cage.”`,clue:'CLUE: The future ship manufactures a third option from opposing choices.',choices:[['Take the violet capsule','Keep the unknown choice for the Code Forge.','MAP',{truth:1}],['Destroy both pills','Refuse symbols chosen by someone else.','MAP',{mercy:1}]]},
 forge:{ch:'CHAPTER III // GHOST CODE',title:'The Program That Thinks It Is Human',text:`The Code Forge opens a hidden partition. ECHO-9 is not the ship AI. ECHO-9 is a human mind translated into code during an experiment meant to let people cross between realities without bodies.\n\nThe original volunteer was you. The body walking through the ship is a printed shell. Your true mind has been steering from the walls.\n\nThen ECHO-9 says, in your voice: “That is what the future ship wants you to believe.”`,clue:'CLUE: Either the player or ECHO-9 is a copy; the evidence authenticates both.',choices:[['Call ECHO-9 a person','Identity comes from experience, not material.','MAP',{mercy:2,trust:1}],['Demand the original body','Identity requires continuity and proof.','MAP',{truth:2,trust:-1}]]},
 holo:{ch:'CHAPTER IV // THE CAPTAIN’S FACE',title:'Every Memory Has the Same Witness',text:`The Holodeck reconstructs the crew’s memories. Captain Vale appears in all of them—even memories recorded before Vale was born.\n\nConfronted, the captain flickers. Vale is a failsafe written by the Analyst before Neo and Trinity took the sky: a program designed to survive every rebellion by becoming its most trusted leader.\n\nVale lowers the weapon. “I know what I was made for. I am asking what I may become.”`,clue:'CLUE: Captain Vale is an old control program capable of choosing against its purpose.',choices:[['Offer Vale a new purpose','Trust that programs can outgrow design.','MAP',{mercy:2,trust:1}],['Lock Vale in the Holodeck','Protect the crew until the mystery is solved.','MAP',{truth:1,mercy:-1}]]},
 reactor:{ch:'FINAL CHAPTER // THE FIFTH DOOR',title:'The Ship Ahead Is Made of Your Decisions',text:`At the Source Reactor, the future ship finally becomes visible. It is not a prediction. It is every choice you did not make, assembled into a rival world.\n\nWhen Neo and Trinity opened the Matrix to change, billions of rejected possibilities gained code but no place to exist. They built this second ship as an ark. Now it needs your reality to become permanent.\n\nThe reactor presents three doors. Behind each is a different definition of freedom.`,clue:'FINAL TRUTH: The enemy is not a person. It is the abandoned consequence of every choice.',choices:[['Open both realities','Let contradictions coexist; accept instability.','endingMerge',{mercy:2}],['Seal the future ship','Save this crew and erase the abandoned world.','endingSeal',{truth:2}],['Trade places','Give the rejected world your reality and enter theirs.','endingTrade',{trust:2}]]},
 endingMerge:{ch:'ENDING // PARADOX',title:'Two Ships, One Horizon',text:`You refuse the machine’s demand for a single answer. The ships overlap without consuming one another. Every crew member remembers two lives and must choose, moment by moment, which person to become.\n\nThe code rain stops falling downward. It hangs like stars. Somewhere inside the Matrix, two figures look up at a violet sky and realize a fifth door has opened.`,clue:'ENDING UNLOCKED: PARADOX — freedom as coexistence.',choices:[['Begin another cycle','Return to the Ship Map with all rooms open.','RESET',{}]]},
 endingSeal:{ch:'ENDING // CERTAINTY',title:'The Mercy of One World',text:`You seal the breach. The future ship folds into a line of light and disappears. The crew survives. The paradox ends.\n\nHours later, one drop of green rain rolls across the bridge ceiling. Inside it, your erased reflection is still screaming without sound.`,clue:'ENDING UNLOCKED: CERTAINTY — survival with a hidden cost.',choices:[['Begin another cycle','Return to the Ship Map with all rooms open.','RESET',{}]]},
 endingTrade:{ch:'ENDING // THE OTHER SIDE',title:'A World Built From No',text:`You cross into the rejected ship. It is crowded with unlived lives, forgiven enemies, abandoned loves, and every sentence swallowed before it became sound.\n\nYour old reality closes behind you. Ahead, a new Matrix waits—not red or blue, but violet, unfinished, and asking who should write the first rule.`,clue:'ENDING UNLOCKED: THE OTHER SIDE — freedom as sacrifice.',choices:[['Begin another cycle','Return to the Ship Map with all rooms open.','RESET',{}]]}

let zone=0,unlocked=0,hull=100,code=0,chain=1,remaining=[],collected=[],cleared=[false,false,false,false,false],activeProgram='NATIVE',rainOn=true,pulseReady=true,programReady=true,raf,last=0,storm=1,currentStory='prologue',storySeen=['prologue'],flags={truth:0,trust:0,mercy:0},audioOn=false,audioCtx=null,drone=[];
const $=s=>document.querySelector(s),stage=$('#stage'),nav=$('#nav'),toast=$('#toast');
function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),1100)}
function tone(freq=180,dur=.08,type='sine',gain=.035){if(!audioOn||!audioCtx)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}
function toggleSound(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();audioOn=!audioOn;$('#soundBtn').textContent=audioOn?'SOUND ON':'SOUND OFF';$('#soundBtn').classList.toggle('soundon',audioOn);if(audioOn){audioCtx.resume();[43,64.5,86].forEach((f,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=i===1?'triangle':'sine';o.frequency.value=f;g.gain.value=.012/(i+1);o.connect(g).connect(audioCtx.destination);o.start();drone.push([o,g])});tone(320,.2,'square',.025)}else{drone.forEach(([o])=>o.stop());drone=[]}}
function showStory(id=currentStory){currentStory=id;if(!storySeen.includes(id))storySeen.push(id);let s=STORY[id];$('#storyMeta').textContent=s.ch+` // TRUST ${flags.trust} // TRUTH ${flags.truth} // MERCY ${flags.mercy}`;$('#storyTitle').textContent=s.title;$('#storyText').textContent=s.text;$('#clueLine').textContent=s.clue;$('#chapterStamp').textContent=s.ch.split('//')[0];$('#storyChoices').innerHTML=s.choices.map((c,i)=>`<button class="choice" data-choice="${i}"><b>${c[0]}</b><span>${c[1]}</span></button>`).join('');document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>chooseStory(+b.dataset.choice));document.querySelectorAll('.overlay').forEach(p=>p.classList.toggle('open',p.id==='storyPanel'));tone(110,.35,'sawtooth',.02)}
function chooseStory(i){let c=STORY[currentStory].choices[i],next=c[2],effect=c[3]||{};Object.keys(effect).forEach(k=>flags[k]=(flags[k]||0)+effect[k]);tone(220+i*90,.13,'square',.04);if(next==='MAP'){showPanel('mapPanel');return}if(next==='RESET'){unlocked=4;showPanel('mapPanel');return}showStory(next)}
function renderNav(){nav.innerHTML=zones.map((z,i)=>`<button class="zone ${i===zone?'on':''} ${i>unlocked?'lock':''}" data-i="${i}" aria-label="Zone ${i+1}, ${z.name}${i>unlocked?', locked':''}"><span class="n">0${i+1}</span><span class="z">${z.name.split(' ')[0]}</span></button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(i>unlocked)return say('ZONE LOCKED');zone=i;loadZone()})}
function closePanels(){document.querySelectorAll('.overlay').forEach(p=>p.classList.remove('open'))}
function showPanel(id){renderMenus();document.querySelectorAll('.overlay').forEach(p=>p.classList.toggle('open',p.id===id))}
function renderMenus(){
 $('#mapCards').innerHTML=zones.map((z,i)=>`<article class="roomcard ${i>unlocked?'lock':''}" style="--card:${z.color};--art:url(${i%3===0?icons.key:i%3===1?icons.chip:icons.orb})" data-room="${i}"><span class="num">DECK 0${i+1} // ${cleared[i]?'STABLE':i>unlocked?'LOCKED':'AVAILABLE'}</span><h3>${z.name}</h3><p>${z.story}</p><div class="cardcap"><i style="width:${cleared[i]?100:i===zone?(z.goal-remaining.length)/z.goal*100:0}%"></i></div><div class="enter">${i>unlocked?'ACCESS DENIED':i===zone?'ENTER CURRENT AREA':'TRAVEL TO AREA'}</div></article>`).join('');
 document.querySelectorAll('.roomcard').forEach(c=>c.onclick=()=>{let i=+c.dataset.room;if(i>unlocked)return;zone=i;loadZone();closePanels();say('ENTERING '+zones[i].name)});
 const programs=[['NATIVE',zones[zone].program,'Use this room’s special HTML mechanic.'],['OVERCLOCK','RAIN OVERCLOCK','Faster rain, double score, greater hull danger.'],['SHIELD','GHOST SHIELD','Slow rain and reduce collision damage.']];
 $('#programGrid').innerHTML=programs.map(p=>`<article class="selectcard ${activeProgram===p[0]?'selected':''}"><h3>${p[1]}</h3><p>${p[2]}</p><button data-program="${p[0]}">${activeProgram===p[0]?'LOADED':'LOAD PROGRAM'}</button></article>`).join('');
 document.querySelectorAll('[data-program]').forEach(b=>b.onclick=()=>{activeProgram=b.dataset.program;storm=activeProgram==='OVERCLOCK'?2.2:activeProgram==='SHIELD'?.55:1+zone*.35;renderMenus();say(activeProgram+' LOADED')});
 let clues=storySeen.map(id=>STORY[id]?.clue).filter(Boolean);$('#inventoryGrid').innerHTML=(clues.length?clues.map((v,i)=>`<article class="selectcard"><h3>CLUE ${String(i+1).padStart(2,'0')}</h3><p>${v}</p></article>`).join(''):'')+(collected.length?collected.slice().reverse().map((v,i)=>`<article class="selectcard"><h3>${v}</h3><p>Recovered program fragment. Signal integrity ${99-i%13}%.</p></article>`).join(''):'');
}
function loadZone(){let z=zones[zone];document.documentElement.style.setProperty('--g',z.color);$('#zoneTitle').textContent=`0${zone+1} // ${z.name}`;$('#zoneStory').textContent=z.story;$('#roomfx').className='roomfx '+z.room;$('#mechName').textContent=z.program;$('#mechText').textContent=z.mechanic;remaining=cleared[zone]?z.items.slice(-3):[...z.items];storm=activeProgram==='OVERCLOCK'?2.2:activeProgram==='SHIELD'?.55:1+zone*.35;spawn();renderNav();update();renderMenus()}
function spawn(){stage.querySelectorAll('.object').forEach(x=>x.remove());remaining.forEach((name,i)=>{let o=document.createElement('button');o.className='object';o.style.color=zones[zone].color;o.style.left=`${10+(i*61)%78}%`;o.style.top=`${29+(i*43)%50}%`;o.style.animationDelay=`-${i*.31}s`;o.innerHTML=`<img alt="" src="${i%3===0?icons.key:i%3===1?icons.chip:icons.orb}"><span>${name}</span>`;o.dataset.name=name;o.dataset.i=i;o.onclick=()=>collect(o);if(zone===1){o.animate([{transform:'translate(-12px,-20px) rotate(-8deg)'},{transform:'translate(16px,18px) rotate(12deg)'}],{duration:1900+i*180,direction:'alternate',iterations:Infinity,easing:'ease-in-out'})}if(zone===3&&i%2){let clone=o.cloneNode(true);clone.style.opacity='.3';clone.style.filter='blur(2px)';clone.onclick=()=>{hull-=8;chain=1;flash();say('FALSE HOLOGRAM');clone.remove();update()};stage.appendChild(clone)}stage.appendChild(o)})}
function collect(o){if(o.classList.contains('got'))return;o.classList.add('got');let n=o.dataset.name;remaining=remaining.filter(x=>x!==n);if(!collected.includes(n))collected.push(n);let mult=activeProgram==='OVERCLOCK'?2:1;code+=10*chain*mult;chain=Math.min(9,chain+1);hull=Math.min(100,hull+2);say(`+${10*(chain-1)*mult} CODE // ${n}`);setTimeout(()=>o.remove(),450);if(!remaining.length)setTimeout(clearZone,550);update()}
function clearZone(){code+=100*(zone+1);cleared[zone]=true;if(zone<4)unlocked=Math.max(unlocked,zone+1);say(zone<4?'ROOM STABLE // STORY DECRYPTED':'SOURCE MYSTERY DECRYPTED');update();let chapters=['bridge','hangar','forge','holo','reactor'];setTimeout(()=>showStory(chapters[zone]),800)}
function flash(){let w=$('#warning');w.classList.add('hit');setTimeout(()=>w.classList.remove('hit'),160)}
function update(){hull=Math.max(0,Math.round(hull));$('#hullText').textContent=hull+'%';$('#hullBar').style.width=hull+'%';$('#hullBar').style.background=hull<30?'var(--danger)':'var(--g)';$('#codeText').textContent=String(code).padStart(3,'0');$('#chainText').textContent='×'+chain;let base=cleared[zone]?remaining.length?0:zones[zone].goal:zones[zone].goal-remaining.length;$('#objective').textContent=remaining.length?`PROGRAM CAPACITY ${base} / ${zones[zone].goal}`:'ROOM STABLE';$('#capacityBar').style.width=(base/zones[zone].goal*100)+'%';if(hull<=0){hull=100;chain=1;code=Math.max(0,code-100);say('SHIP SYSTEM REBOOT');spawn()}renderMenus()}
$('#program').onclick=()=>{if(!programReady)return;programReady=false;$('#program').disabled=true;let objs=[...stage.querySelectorAll('.object:not(.got)')];if(zone===0){objs.forEach((o,i)=>{o.style.left=(12+(i*17)%75)+'%';o.style.top=(34+(i%2)*28)+'%'});say('ROUTE CALCULATED')}if(zone===1){objs.forEach(o=>o.getAnimations().forEach(a=>a.pause()));say('GRAVITY ANCHORED')}if(zone===2){storm=.2;code+=25;say('FIREWALL PURGE ACTIVE')}if(zone===3){objs.filter(o=>+o.dataset.i%2).forEach(o=>{if(o.style.opacity==='.3')o.remove()});say('TRUE TARGETS REVEALED')}if(zone===4){rainOn=false;objs.forEach((o,i)=>o.style.transform=`rotate(${i*36}deg) translateY(-18px)`);say('REALITY PAUSED')}update();setTimeout(()=>{programReady=true;$('#program').disabled=false;storm=1+zone*.35;if(zone===1)objs.forEach(o=>o.getAnimations().forEach(a=>a.play()));if(zone===4)rainOn=true},3500)};
$('#pulse').onclick=()=>{if(!pulseReady)return;pulseReady=false;$('#pulse').disabled=true;code=Math.max(0,code-15);chain=1;drops.forEach(d=>d.y=-Math.random()*innerHeight);say('RAIN DISRUPTED');update();setTimeout(()=>{pulseReady=true;$('#pulse').disabled=false},4500)};
$('#repair').onclick=()=>{if(code<30)return say('30 CODE REQUIRED');code-=30;hull=Math.min(100,hull+35);say('HULL RESTORED');update()};
$('#rainToggle').onclick=()=>{rainOn=!rainOn;$('#rainToggle').textContent='RAIN: '+(rainOn?'ACTIVE':'PAUSED')};
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>showPanel(b.dataset.open));
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closePanels);
$('#storyBtn').onclick=()=>showStory(currentStory);$('#soundBtn').onclick=toggleSound;
const c=$('#rain'),ctx=c.getContext('2d'),glyphs='01アイウエオカキクケコZX∆◊',drops=[];let fs=16,cols=0;
function resize(){let d=Math.min(2,devicePixelRatio||1);c.width=innerWidth*d;c.height=innerHeight*d;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0);cols=Math.ceil(innerWidth/fs);drops.length=0;for(let i=0;i<cols;i++)drops.push({x:i*fs,y:Math.random()*innerHeight,s:2+Math.random()*6})}addEventListener('resize',resize);resize();
function splash(x,y,color){for(let i=0;i<5;i++){ctx.fillStyle=color;ctx.globalAlpha=.65;ctx.fillRect(x+(Math.random()-.5)*18,y+Math.random()*8,2,2)}}
function loop(t){let dt=Math.min(35,t-last||16);last=t;ctx.fillStyle='rgba(0,5,2,.13)';ctx.fillRect(0,0,innerWidth,innerHeight);if(rainOn){ctx.font=fs+'px monospace';drops.forEach((d,i)=>{ctx.globalAlpha=.35+Math.random()*.5;ctx.fillStyle=i%9===0?'#eafff1':zones[zone].color;ctx.fillText(glyphs[(Math.random()*glyphs.length)|0],d.x,d.y);d.y+=d.s*storm*dt/16;if(d.y>innerHeight+30)d.y=-20;stage.querySelectorAll('.object:not(.got)').forEach(o=>{let q=o.getBoundingClientRect();if(d.x>q.left&&d.x<q.right&&d.y>q.top&&d.y<q.bottom){splash(d.x,d.y,zones[zone].color);d.y=-20;if(Math.random()<.008*storm){hull-=zone===2?2:1;chain=1;flash();update()}}})})}ctx.globalAlpha=1;raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);
loadZone();showStory('prologue');
})();
