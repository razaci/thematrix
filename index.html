<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020805">
<title>The Matrix — Rainship</title>
<meta name="description" content="Pilot a ship through five zones of living code rain.">
<style>
:root{--g:#35ff8a;--lime:#b7ff3c;--ink:#020805;--panel:rgba(3,18,12,.84);--line:rgba(77,255,148,.22);--danger:#ff4066;--cyan:#3cecff}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#010503;color:#dfffea;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}button{font:inherit;color:inherit}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:30;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.13) 4px);mix-blend-mode:multiply}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;background:radial-gradient(circle at 50% 45%,#062716 0,#020906 50%,#000 100%)}
.shell{position:relative;z-index:2;height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));gap:9px}
.top{display:grid;grid-template-columns:1fr auto;gap:9px}.brand,.status,.nav,.mission,.console{border:1px solid var(--line);background:var(--panel);box-shadow:0 0 22px rgba(0,255,120,.06),inset 0 0 24px rgba(0,0,0,.55);backdrop-filter:blur(8px)}
.brand{padding:9px 12px;border-left:3px solid var(--g)}.brand b{display:block;font:900 clamp(1.25rem,5vw,2.1rem)/.9 system-ui;letter-spacing:.11em;color:white}.brand small{color:#78c995;letter-spacing:.08em}
.status{display:flex;align-items:center;gap:12px;padding:8px 11px}.stat{min-width:62px}.label{font-size:.68rem;color:#77b78e}.value{font-weight:900;color:var(--g)}.meter{height:3px;background:#183126;margin-top:4px}.meter i{display:block;height:100%;background:var(--g);box-shadow:0 0 8px var(--g);transition:width .3s}
.stage{position:relative;min-height:0;border:1px solid rgba(82,255,149,.28);overflow:hidden;background:linear-gradient(180deg,rgba(0,12,8,.18),rgba(0,0,0,.44));box-shadow:inset 0 0 90px #000,0 0 24px rgba(0,255,120,.08)}
.stage:before,.stage:after{content:"";position:absolute;z-index:5;top:0;bottom:0;width:25px;background:linear-gradient(90deg,#07100c,#10251a 45%,#000 48%,#14291d 55%,transparent);border-right:1px solid #204b34}.stage:after{right:0;transform:scaleX(-1)}
.horizon{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(transparent,rgba(0,255,120,.03)),repeating-linear-gradient(90deg,transparent 0 48px,rgba(68,255,137,.1) 49px 50px),repeating-linear-gradient(0deg,transparent 0 35px,rgba(68,255,137,.08) 36px 37px);transform:perspective(250px) rotateX(52deg);transform-origin:bottom}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.portal{width:min(55vw,350px);aspect-ratio:1;border-radius:50%;border:2px solid var(--g);box-shadow:0 0 18px var(--g),inset 0 0 40px rgba(0,255,130,.2);animation:spin 12s linear infinite;background:conic-gradient(from 20deg,transparent,var(--g),transparent 16%,transparent 45%,var(--cyan),transparent 57%,transparent)}
.portal:after{content:"";position:absolute;inset:18%;border-radius:50%;border:1px dashed var(--g)}@keyframes spin{to{transform:rotate(360deg)}}
.object{position:absolute;z-index:7;width:56px;height:56px;border:1px solid currentColor;background:rgba(0,15,8,.86);display:grid;place-items:center;cursor:pointer;filter:drop-shadow(0 0 8px currentColor);animation:float 2.7s ease-in-out infinite}.object img{width:68%;height:68%}.object span{position:absolute;top:100%;font-size:.64rem;white-space:nowrap;color:#ccffe1;margin-top:4px}.object.got{animation:collect .45s forwards;pointer-events:none}@keyframes float{50%{transform:translateY(-8px)}}@keyframes collect{to{transform:scale(2) rotate(30deg);opacity:0}}
.mission{position:absolute;z-index:8;left:34px;top:16px;width:min(270px,calc(100% - 68px));padding:10px}.mission b{color:white}.mission p{font-size:.76rem;margin:4px 0 0;color:#8fd5a7}.mission em{display:block;color:var(--lime);font-style:normal;margin-top:6px;font-size:.76rem}
.toast{position:absolute;z-index:12;left:50%;bottom:18px;transform:translate(-50%,20px);background:#dfffea;color:#001b0c;padding:8px 14px;font-weight:900;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.controls{display:grid;grid-template-columns:1fr auto;gap:9px;min-height:0}.nav{display:grid;grid-template-columns:repeat(5,1fr);padding:5px;gap:5px}.zone{min-height:52px;border:1px solid transparent;background:#06140d;padding:5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.zone .n{font-size:.65rem;color:#7cb48f}.zone .z{font-size:.76rem;font-weight:900}.zone:hover,.zone:focus-visible{border-color:var(--g);outline:none}.zone.on{background:var(--g);color:#00170a;box-shadow:0 0 16px rgba(53,255,138,.35)}.zone.on .n{color:#184529}.zone.lock{opacity:.45}
.console{display:flex;gap:6px;padding:6px}.action{border:1px solid #2e8b55;background:#092516;padding:0 13px;cursor:pointer;font-weight:900;min-width:82px}.action:hover,.action:active{background:var(--g);color:#00180b}.action:disabled{opacity:.35}
.hint{position:absolute;right:34px;top:18px;z-index:8;color:#7fc99a;font-size:.7rem;text-align:right}.rain-toggle{border:0;background:none;color:var(--g);cursor:pointer;padding:0}
@media(max-width:650px){.shell{padding-left:7px;padding-right:7px}.brand small{display:none}.status{gap:7px}.stat{min-width:48px}.stat:nth-child(3){display:none}.controls{grid-template-columns:1fr}.console{position:absolute;right:15px;bottom:84px;z-index:10;background:transparent;border:0;box-shadow:none}.action{min-width:64px;height:42px;padding:0 8px;background:#061b10}.nav{gap:2px}.zone{min-height:58px}.zone .z{font-size:.64rem}.mission{top:10px}.hint{display:none}.object{width:48px;height:48px}}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<main class="shell">
  <header class="top">
    <div class="brand"><b>THE MATRIX</b><small>RAINSHIP // SIGNAL INTERCEPTOR</small></div>
    <div class="status" aria-label="Ship status">
      <div class="stat"><div class="label">HULL</div><div class="value" id="hullText">100%</div><div class="meter"><i id="hullBar" style="width:100%"></i></div></div>
      <div class="stat"><div class="label">CODE</div><div class="value" id="codeText">000</div></div>
      <div class="stat"><div class="label">CHAIN</div><div class="value" id="chainText">×1</div></div>
    </div>
  </header>
  <section class="stage" id="stage" aria-label="Current Matrix zone">
    <div class="horizon"></div><div class="scene"><div class="portal"></div></div>
    <aside class="mission"><b id="zoneTitle">01 // AWAKENING BAY</b><p id="zoneStory"></p><em id="objective"></em></aside>
    <div class="hint">TAP RELICS BEFORE<br>THE RAIN CORRUPTS THEM<br><button class="rain-toggle" id="rainToggle">RAIN: ACTIVE</button></div>
    <div class="toast" id="toast" role="status"></div>
  </section>
  <footer class="controls">
    <nav class="nav" id="nav" aria-label="Ship zones"></nav>
    <div class="console"><button class="action" id="pulse">EMP PULSE</button><button class="action" id="repair">REPAIR</button></div>
  </footer>
</main>
<script>
(()=>{
const zones=[
 {name:'AWAKENING BAY',story:'The ship wakes inside a storm of machine code.',goal:3,color:'#35ff8a',items:['RED KEY','WHITE RABBIT','SIGNAL']},
 {name:'MIRROR DECK',story:'Reflections predict your movement one second early.',goal:4,color:'#3cecff',items:['MIRROR','ECHO','GLITCH','TRACE']},
 {name:'AGENT VAULT',story:'Security programs are rewriting the sealed archive.',goal:5,color:'#ff4066',items:['CIPHER','BADGE','CORE','MASK','ACCESS']},
 {name:'ZION ENGINE',story:'Human power and machine logic share one failing heart.',goal:5,color:'#ffc83c',items:['SPARK','CELL','GEAR','BREATH','BEACON']},
 {name:'SOURCE BRIDGE',story:'Choose the pattern that controls the rain itself.',goal:6,color:'#d78cff',items:['CHOICE','DOOR','ORACLE','VOID','LIGHT','ONE']}
];
const icons={
 key:'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PGNpcmNsZSBjeD0iMjAiIGN5PSIyMiIgcj0iMTIiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmZjAwMCIgc3Ryb2tlLXdpZHRoPSI2Ii8+PHBhdGggZD0iTTI5IDMwTDU0IDU1TTQyIDQybDgtOE01MCA1MGw4LTgiIHN0cm9rZT0iI2ZmZjAwMCIgc3Ryb2tlLXdpZHRoPSI2Ii8+PC9zdmc+',
 chip:'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3QgeD0iMTQiIHk9IjE0IiB3aWR0aD0iMzYiIGhlaWdodD0iMzYiIHJ4PSI0IiBmaWxsPSJub25lIiBzdHJva2U9IiMzNWZmOGEiIHN0cm9rZS13aWR0aD0iNCIvPjxwYXRoIGQ9Ik0yMiAyMnYyMGgyMFYyMnpNMCAyNGgxNE0wIDQwaDE0TTY0IDI0SDUwTTY0IDQwSDUwTTI0IDB2MTRNNDAgMHYxNE0yNCA2NHYtMTRNNDAgNjR2LTE0IiBzdHJva2U9IiMzNWZmOGEiIHN0cm9rZS13aWR0aD0iNCIvPjwvc3ZnPg==',
 orb:'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PGRlZnM+PHJhZGlhbEdyYWRpZW50IGlkPSJnIj48c3RvcCBzdG9wLWNvbG9yPSIjZmZmIi8+PHN0b3Agb2Zmc2V0PSIuMzUiIHN0b3AtY29sb3I9IiMzY2VjZmYiLz48c3RvcCBvZmZzZXQ9IjEiIHN0b3AtY29sb3I9IiMwMDIyMzMiLz48L3JhZGlhbEdyYWRpZW50PjwvZGVmcz48Y2lyY2xlIGN4PSIzMiIgY3k9IjMyIiByPSIyNiIgZmlsbD0idXJsKCNnKSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIiLz48L3N2Zz4='};
let zone=0,unlocked=0,hull=100,code=0,chain=1,remaining=[],rainOn=true,pulseReady=true,raf,last=0;
const $=s=>document.querySelector(s),stage=$('#stage'),nav=$('#nav'),toast=$('#toast');
function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),1100)}
function renderNav(){nav.innerHTML=zones.map((z,i)=>`<button class="zone ${i===zone?'on':''} ${i>unlocked?'lock':''}" data-i="${i}" aria-label="Zone ${i+1}, ${z.name}${i>unlocked?', locked':''}"><span class="n">0${i+1}</span><span class="z">${z.name.split(' ')[0]}</span></button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(i>unlocked)return say('ZONE LOCKED');zone=i;loadZone()})}
function loadZone(){document.documentElement.style.setProperty('--g',zones[zone].color);$('#zoneTitle').textContent=`0${zone+1} // ${zones[zone].name}`;$('#zoneStory').textContent=zones[zone].story;remaining=[...zones[zone].items];spawn();renderNav();update()}
function spawn(){stage.querySelectorAll('.object').forEach(x=>x.remove());remaining.forEach((name,i)=>{let o=document.createElement('button');o.className='object';o.style.color=zones[zone].color;o.style.left=`${13+(i*73)%72}%`;o.style.top=`${31+(i*37)%46}%`;o.innerHTML=`<img alt="" src="${i%3===0?icons.key:i%3===1?icons.chip:icons.orb}"><span>${name}</span>`;o.dataset.name=name;o.onclick=()=>collect(o);stage.appendChild(o)})}
function collect(o){if(o.classList.contains('got'))return;o.classList.add('got');let n=o.dataset.name;remaining=remaining.filter(x=>x!==n);code+=10*chain;chain=Math.min(9,chain+1);hull=Math.min(100,hull+2);say(`+${10*(chain-1)} CODE // ${n}`);setTimeout(()=>o.remove(),450);if(!remaining.length)setTimeout(clearZone,550);update()}
function clearZone(){code+=100*(zone+1);say('ZONE STABILIZED');if(zone<4){unlocked=Math.max(unlocked,zone+1);setTimeout(()=>{zone++;loadZone()},950)}else{setTimeout(()=>{say('THE RAIN ANSWERS TO YOU');remaining=[...zones[4].items];spawn()},1200)}update()}
function update(){hull=Math.max(0,Math.round(hull));$('#hullText').textContent=hull+'%';$('#hullBar').style.width=hull+'%';$('#hullBar').style.background=hull<30?'var(--danger)':'var(--g)';$('#codeText').textContent=String(code).padStart(3,'0');$('#chainText').textContent='×'+chain;$('#objective').textContent=remaining.length?`RECOVER ${remaining.length} / ${zones[zone].goal} RELICS`:'ZONE CLEAR';if(hull<=0){hull=100;chain=1;code=Math.max(0,code-100);say('SYSTEM REBOOT');spawn()}}
$('#pulse').onclick=()=>{if(!pulseReady)return;pulseReady=false;$('#pulse').disabled=true;code=Math.max(0,code-15);chain=1;drops.forEach(d=>d.y=-Math.random()*innerHeight);say('RAIN DISRUPTED');update();setTimeout(()=>{pulseReady=true;$('#pulse').disabled=false},4500)};
$('#repair').onclick=()=>{if(code<30)return say('30 CODE REQUIRED');code-=30;hull=Math.min(100,hull+35);say('HULL RESTORED');update()};
$('#rainToggle').onclick=()=>{rainOn=!rainOn;$('#rainToggle').textContent='RAIN: '+(rainOn?'ACTIVE':'PAUSED')};
const c=$('#rain'),ctx=c.getContext('2d'),glyphs='01アイウエオカキクケコZX∆◊',drops=[];let fs=16,cols=0;
function resize(){let d=Math.min(2,devicePixelRatio||1);c.width=innerWidth*d;c.height=innerHeight*d;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0);cols=Math.ceil(innerWidth/fs);drops.length=0;for(let i=0;i<cols;i++)drops.push({x:i*fs,y:Math.random()*innerHeight,s:2+Math.random()*6})}addEventListener('resize',resize);resize();
function splash(x,y,color){for(let i=0;i<5;i++){ctx.fillStyle=color;ctx.globalAlpha=.65;ctx.fillRect(x+(Math.random()-.5)*18,y+Math.random()*8,2,2)}}
function loop(t){let dt=Math.min(35,t-last||16);last=t;ctx.fillStyle='rgba(0,5,2,.13)';ctx.fillRect(0,0,innerWidth,innerHeight);if(rainOn){ctx.font=fs+'px monospace';drops.forEach((d,i)=>{ctx.globalAlpha=.35+Math.random()*.5;ctx.fillStyle=i%9===0?'#eafff1':zones[zone].color;ctx.fillText(glyphs[(Math.random()*glyphs.length)|0],d.x,d.y);d.y+=d.s*dt/16;if(d.y>innerHeight+30)d.y=-20;let r=stage.getBoundingClientRect();stage.querySelectorAll('.object:not(.got)').forEach(o=>{let q=o.getBoundingClientRect();if(d.x>q.left&&d.x<q.right&&d.y>q.top&&d.y<q.bottom){splash(d.x,d.y,zones[zone].color);d.y=-20;if(Math.random()<.012){hull-=1;chain=1;update()}}})})}ctx.globalAlpha=1;raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);
loadZone();
})();
</script>
</body>
</html>
