<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MATRIX: AFTERIMAGE</title>
<style>
:root{--bg:#020503;--panel:#07110b;--panel2:#0b1810;--line:#244c35;--text:#effff3;--muted:#a7c7b0;--accent:#ffd84d}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}
body{min-height:100vh;overflow:hidden}
#game{height:100vh;display:grid;grid-template-rows:auto 1fr;background:
radial-gradient(circle at 50% 15%,#0b2114 0,#020503 45%,#000 100%)}
.topbar{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-bottom:1px solid #173522;background:#020604}
.brand{font-weight:900;letter-spacing:.08em}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:10px monospace;border:1px solid #31583e;border-radius:999px;padding:5px 8px;background:#07110b}
.stage{position:relative;min-height:0;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.52) contrast(1.06)}
.fx{position:absolute;inset:0;pointer-events:none;background:
linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.78) 76%,#000),
repeating-linear-gradient(180deg,rgba(80,255,130,.02) 0 2px,transparent 2px 5px)}
.rain{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.35}
.rain span{position:absolute;top:-30px;color:#70ff9e;font:12px monospace;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh)}}
.layer{position:absolute;left:0;right:0;bottom:0;padding:12px;display:grid;gap:8px}
.card{background:rgba(2,8,5,.9);border:1px solid var(--line);border-radius:14px;padding:11px;backdrop-filter:blur(8px)}
.kicker{font:10px monospace;color:#bde8c7;letter-spacing:.12em}
h1,h2,h3,p{margin:.2rem 0}
.story{font-size:14px;line-height:1.45;color:#f7fff9}
.sub{font:11px monospace;color:#d9f5df}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.room{min-height:72px;text-align:left;border-radius:10px;padding:9px;background:#0c1b12;color:#fff;border:1px solid #3b6849;font-weight:900}
.room small{display:block;color:var(--muted);font-weight:500;margin-top:3px}
.room.active{outline:2px solid #79d28f}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
button{cursor:pointer}
.darkbtn,.quizbtn{min-height:44px;border-radius:9px;border:1px solid #416a4d;background:#0a1710;color:#fff;font-weight:800}
.guide{min-height:52px;border-radius:11px;border:2px solid var(--accent);background:var(--accent);color:#171100;font-weight:950;font-size:14px}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at center,#0a1f12 0,#000 70%);z-index:20}
.startbox{max-width:650px;width:100%;text-align:center}
.startbox h1{font-size:clamp(32px,7vw,64px)}
.hidden{display:none!important}
.quizgrid{display:grid;gap:6px;margin-top:8px}
.notice{min-height:20px;font:11px monospace;color:#fff0aa}
.cascade{display:grid;gap:7px}
.cascade .card:nth-child(2){margin-left:18px}
.cascade .card:nth-child(3){margin-left:36px}
@media(max-width:760px){
 .grid{grid-template-columns:repeat(2,1fr)}
 .actions{grid-template-columns:1fr 1fr}
 .layer{padding:8px}
 .cascade .card:nth-child(2),.cascade .card:nth-child(3){margin-left:0}
}
</style>
</head>
<body>
<main id="game">
  <div class="topbar">
    <div class="brand">MATRIX: AFTERIMAGE</div>
    <div class="hud">
      <span class="chip" id="day">DAY 1</span>
      <span class="chip" id="hull">HULL 100%</span>
      <span class="chip" id="intel">INTEL 0</span>
    </div>
  </div>
  <section class="stage">
    <img class="bg" id="scene" alt="ship scene">
    <div class="fx"></div>
    <div class="rain" id="rain"></div>

    <div class="layer">
      <div class="cascade">
        <div class="card">
          <div class="kicker" id="kicker">MNEMOSYNE // BRIDGE</div>
          <h2 id="title">BRIDGE</h2>
          <p class="story" id="story"></p>
          <div class="sub" id="sub"></div>
        </div>
        <div class="card">
          <div class="actions" id="actions"></div>
          <div class="notice" id="notice"></div>
          <div id="quizmsg" class="notice"></div>
        </div>
        <div class="card">
          <div class="grid" id="rooms"></div>
          <button class="guide" id="guide">NEXT</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="start">
      <div class="startbox card">
        <div class="kicker">UNOFFICIAL MATRIX-INSPIRED FICTION</div>
        <h1>MATRIX: AFTERIMAGE</h1>
        <p class="story">You are aboard the Mnemosyne, a resistance ship moving through machine space. Walk the ship, talk to Tank, follow the signal, take the quiz, and jack into the Matrix.</p>
        <button class="guide" id="startBtn">START GAME</button>
      </div>
    </div>
  </section>
</main>

function guide(){
 if(!S.signal)return ['NEXT: CHECK THE SIGNAL',()=>go('bridge','signal')];
 if(!S.tank)return ['NEXT: TALK TO TANK',()=>go('operator')];
 if(!S.power)return ['NEXT: ROUTE JACK POWER',()=>go('engineering')];
 if(!S.clue)return ['NEXT: INSPECT THE BUNK',()=>go('quarters')];
 if(!S.quiz)return ['NEXT: TAKE THE QUIZ',()=>go('quiz')];
 if(!S.jack)return ['NEXT: GO TO JACK BAY',()=>go('jack')];
 if(!S.matrix)return ['NEXT: PLUG INTO THE MATRIX',()=>go('jack','plugin')];
 return ['NEXT: FIND THE ARCHIVE DOOR',()=>go('matrix','archive')];
}

 $('#story').textContent=r.story;
 $('#sub').textContent=r.sub;

 if(S.view==='quiz'){
   $('#actions').innerHTML=`<div class="quizgrid" style="grid-column:1/-1">

     <button class="quizbtn" data-q="1">Your physical anchor and route home</button>
     <button class="quizbtn" data-q="2">A decorative simulation</button>

   $$('[data-q]').forEach(b=>b.onclick=()=>answerQuiz(+b.dataset.q));

   $('#actions').innerHTML=r.actions.map(a=>`<button class="darkbtn" data-act="${a[1]}">${a[0]}</button>`).join('');

 $$('[data-room]').forEach(b=>b.onclick=()=>{if(!b.disabled)go(b.dataset.room)});

 updateNotice();
}

function updateNotice(){
 const bits=[];
 if(S.signal)bits.push('signal read');
 if(S.tank)bits.push('Tank briefed');
 if(S.power)bits.push('power ready');
 if(S.clue)bits.push('future clue found');
 if(S.quiz)bits.push('quiz passed');
 if(S.matrix)bits.push('inside Matrix');
 $('#notice').textContent=bits.length?'STATUS // '+bits.join(' // '):'STATUS // waiting for first action';
}

function go(v,action){
 S.view=v;
 if(action)act(action,true);
 render();
}

function act(a,skipRender){
 if(['bridge','operator','engineering','quarters','jack','quiz','matrix'].includes(a)){S.view=a}
 if(a==='signal'){S.signal=true;S.intel++}
 if(a==='course'){S.intel++}
 if(a==='tank'){S.tank=true;S.intel++}
 if(a==='hardline'){S.tank=true;S.intel++}
 if(a==='reactor'){S.hull=Math.min(100,S.hull+1)}
 if(a==='power'){S.power=true}
 if(a==='photo'||a==='bunk'){S.clue=true;S.intel+=2}
 if(a==='cable'){S.jack=true}
 if(a==='plugin'){
   if(!S.power){S.view='engineering';return render()}
   if(!S.tank){S.view='operator';return render()}
   if(!S.quiz){S.view='quiz';return render()}
   S.jack=true;S.matrix=true;S.view='matrix'
 }
 if(a==='scan'||a==='resident'){S.intel++}
 if(a==='archive'){S.matrix=true;S.intel+=3; rooms.matrix.sub='ARCHIVE door located. The next chapter is waiting behind it.'}
 if(!skipRender)render()
}

function answerQuiz(i){
 if(i===1){
   S.quiz=true;S.intel++;
   $('#quizmsg').textContent='CORRECT // MATRIX ACCESS UNLOCKED';
   S.view='jack';
   setTimeout(render,250);
 }else{
   $('#quizmsg').textContent='TRY AGAIN // the ship is your physical anchor and route home.';
 }
}

function startGame(){
 S.started=true;
 $('#start').classList.add('hidden');
 S.view='bridge';
 render();
}

function makeRain(){
 const r=$('#rain');
 for(let i=0;i<42;i++){
   const s=document.createElement('span');
   s.textContent=Math.random()>.5?'0':'1';
   s.style.left=(Math.random()*100)+'%';
   s.style.animationDuration=(2+Math.random()*5)+'s';
   s.style.animationDelay=(-Math.random()*5)+'s';
   r.appendChild(s);
 }
}

document.addEventListener('DOMContentLoaded',()=>{
 makeRain();
 $('#startBtn').onclick=startGame;
 render();
});
</script>
</body>
</html>
