<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020805">
<title>The Matrix — Rainship</title>
<meta name="description" content="Pilot a ship through five zones of living code rain.">
<style>
:root{--g:#35ff8a;--lime:#b7ff3c;--ink:#020805;--panel:rgba(3,18,12,.84);--line:rgba(77,255,148,.22);--danger:#ff4066;--cyan:#3cecff}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#010503;color:#dfffea;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}button{font:inherit;color:inherit}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:30;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.13) 4px);mix-blend-mode:multiply}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;background:radial-gradient(circle at 50% 45%,#062716 0,#020906 50%,#000 100%)}
.shell{position:relative;z-index:2;height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));gap:9px}
.top{display:grid;grid-template-columns:1fr auto;gap:9px}.brand,.status,.nav,.mission,.console{border:1px solid var(--line);background:var(--panel);box-shadow:0 0 22px rgba(0,255,120,.06),inset 0 0 24px rgba(0,0,0,.55);backdrop-filter:blur(8px)}
.brand{padding:9px 12px;border-left:3px solid var(--g)}.brand b{display:block;font:900 clamp(1.25rem,5vw,2.1rem)/.9 system-ui;letter-spacing:.11em;color:white}.brand small{color:#78c995;letter-spacing:.08em}
.status{display:flex;align-items:center;gap:12px;padding:8px 11px}.stat{min-width:62px}.label{font-size:.68rem;color:#77b78e}.value{font-weight:900;color:var(--g)}.meter{height:3px;background:#183126;margin-top:4px}.meter i{display:block;height:100%;background:var(--g);box-shadow:0 0 8px var(--g);transition:width .3s}
.stage{position:relative;min-height:0;border:1px solid rgba(82,255,149,.28);overflow:hidden;background:linear-gradient(180deg,rgba(0,12,8,.18),rgba(0,0,0,.44));box-shadow:inset 0 0 90px #000,0 0 24px rgba(0,255,120,.08)}
.stage:before,.stage:after{content:"";position:absolute;z-index:5;top:0;bottom:0;width:25px;background:linear-gradient(90deg,#07100c,#10251a 45%,#000 48%,#14291d 55%,transparent);border-right:1px solid #204b34}.stage:after{right:0;transform:scaleX(-1)}
.horizon{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(transparent,rgba(0,255,120,.03)),repeating-linear-gradient(90deg,transparent 0 48px,rgba(68,255,137,.1) 49px 50px),repeating-linear-gradient(0deg,transparent 0 35px,rgba(68,255,137,.08) 36px 37px);transform:perspective(250px) rotateX(52deg);transform-origin:bottom}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.portal{width:min(55vw,350px);aspect-ratio:1;border-radius:50%;border:2px solid var(--g);box-shadow:0 0 18px var(--g),inset 0 0 40px rgba(0,255,130,.2);animation:spin 12s linear infinite;background:conic-gradient(from 20deg,transparent,var(--g),transparent 16%,transparent 45%,var(--cyan),transparent 57%,transparent)}
.portal:after{content:"";position:absolute;inset:18%;border-radius:50%;border:1px dashed var(--g)}@keyframes spin{to{transform:rotate(360deg)}}
.object{position:absolute;z-index:7;width:56px;height:56px;border:1px solid currentColor;background:rgba(0,15,8,.86);display:grid;place-items:center;cursor:pointer;filter:drop-shadow(0 0 8px currentColor);animation:float 2.7s ease-in-out infinite}.object img{width:68%;height:68%}.object span{position:absolute;top:100%;font-size:.64rem;white-space:nowrap;color:#ccffe1;margin-top:4px}.object.got{animation:collect .45s forwards;pointer-events:none}@keyframes float{50%{transform:translateY(-8px)}}@keyframes collect{to{transform:scale(2) rotate(30deg);opacity:0}}
.mission{position:absolute;z-index:8;left:34px;top:16px;width:min(270px,calc(100% - 68px));padding:10px}.mission b{color:white}.mission p{font-size:.76rem;margin:4px 0 0;color:#8fd5a7}.mission em{display:block;color:var(--lime);font-style:normal;margin-top:6px;font-size:.76rem}
.toast{position:absolute;z-index:12;left:50%;bottom:18px;transform:translate(-50%,20px);background:#dfffea;color:#001b0c;padding:8px 14px;font-weight:900;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.controls{display:grid;grid-template-columns:1fr auto;gap:9px;min-height:0}.nav{display:grid;grid-template-columns:repeat(5,1fr);padding:5px;gap:5px}.zone{min-height:52px;border:1px solid transparent;background:#06140d;padding:5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.zone .n{font-size:.65rem;color:#7cb48f}.zone .z{font-size:.76rem;font-weight:900}.zone:hover,.zone:focus-visible{border-color:var(--g);outline:none}.zone.on{background:var(--g);color:#00170a;box-shadow:0 0 16px rgba(53,255,138,.35)}.zone.on .n{color:#184529}.zone.lock{opacity:.45}
.console{display:flex;gap:6px;padding:6px}.action{border:1px solid #2e8b55;background:#092516;padding:0 13px;cursor:pointer;font-weight:900;min-width:82px}.action:hover,.action:active{background:var(--g);color:#00180b}.action:disabled{opacity:.35}
.hint{position:absolute;right:34px;top:18px;z-index:8;color:#7fc99a;font-size:.7rem;text-align:right}.rain-toggle{border:0;background:none;color:var(--g);cursor:pointer;padding:0}
.roomfx{position:absolute;inset:0;overflow:hidden;pointer-events:none}.roomfx:before,.roomfx:after{content:"";position:absolute}.bridge{background:radial-gradient(ellipse at 50% 64%,#0a2b1c 0 10%,transparent 35%),linear-gradient(#010806 58%,#07140e 59%)}.bridge:before{left:10%;right:10%;top:18%;height:40%;border:10px solid #132d21;border-bottom-width:25px;clip-path:polygon(0 0,100% 0,92% 100%,8% 100%);background:radial-gradient(circle at 50% 45%,#064927,transparent 42%),repeating-linear-gradient(90deg,transparent 0 48px,#35ff8a22 50px)}.bridge:after{left:8%;right:8%;bottom:2%;height:28%;background:repeating-linear-gradient(90deg,#101e17 0 9%,#020705 9% 11%);clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}
.hangar{background:linear-gradient(#03080d,#041c27 55%,#020505 56%)}.hangar:before{inset:10% 7% 20%;border:10px solid #173846;background:repeating-linear-gradient(90deg,transparent 0 10%,#3cecff1f 10.5% 11%),repeating-linear-gradient(0deg,transparent 0 18%,#3cecff17 19% 20%);clip-path:polygon(5% 0,95% 0,100% 100%,0 100%)}.hangar:after{width:44%;height:19%;left:28%;bottom:18%;border:3px solid #3cecff;background:#07161d;clip-path:polygon(15% 0,85% 0,100% 50%,72% 70%,61% 100%,39% 100%,28% 70%,0 50%);filter:drop-shadow(0 0 18px #3cecff)}
.forge{background:radial-gradient(circle at 50% 75%,#5a0716,transparent 22%),linear-gradient(#0b0205,#21040c)}.forge:before{left:12%;right:12%;bottom:4%;height:66%;background:repeating-linear-gradient(90deg,#210812 0 6%,transparent 6% 12%);border-top:6px solid #ff4066;clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}.forge:after{width:180px;height:180px;border:8px double #ff4066;border-radius:50%;left:calc(50% - 90px);top:34%;box-shadow:0 0 45px #ff406688,inset 0 0 45px #ff406655;animation:spin 5s linear infinite}
.holodeck{background:linear-gradient(#110b02,#281902 62%,#090601)}.holodeck:before{inset:13% 8%;background:repeating-linear-gradient(90deg,transparent 0 39px,#ffc83c22 40px),repeating-linear-gradient(0deg,transparent 0 39px,#ffc83c22 40px);transform:perspective(350px) rotateX(12deg);border:2px solid #ffc83c66}.holodeck:after{left:18%;right:18%;top:29%;height:38%;background:linear-gradient(90deg,#ffc83c08,#ffc83c44,#ffc83c08);filter:blur(8px);animation:flicker 1.2s steps(2) infinite}@keyframes flicker{50%{opacity:.35;transform:translateX(4px)}}
.reactor{background:radial-gradient(circle at 50% 58%,#471f62,transparent 18%),linear-gradient(#08020e,#1b0828)}.reactor:before{width:min(43vw,270px);aspect-ratio:1;left:50%;top:53%;transform:translate(-50%,-50%);border-radius:50%;border:12px dotted #d78cff;box-shadow:0 0 50px #d78cff,inset 0 0 50px #d78cff;animation:spin 3s linear infinite}.reactor:after{left:5%;right:5%;top:12%;bottom:8%;border:8px solid #261135;clip-path:polygon(8% 0,92% 0,100% 18%,100% 82%,92% 100%,8% 100%,0 82%,0 18%)}
.capacity{height:5px;margin-top:7px;background:#152c20}.capacity i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--lime));box-shadow:0 0 9px var(--g);transition:width .25s}.mech{position:absolute;z-index:8;right:34px;bottom:74px;width:170px;padding:7px;border-left:2px solid var(--g);background:#020c08cc;font-size:.62rem;color:#8fd5a7}.mech b{display:block;color:#fff;margin-bottom:3px}.warning{position:absolute;z-index:6;inset:0;border:0 solid var(--danger);pointer-events:none;transition:.12s}.warning.hit{border-width:10px;box-shadow:inset 0 0 60px var(--danger)}
@media(max-width:650px){.shell{padding-left:7px;padding-right:7px}.brand small{display:none}.status{gap:7px}.stat{min-width:48px}.stat:nth-child(3){display:none}.controls{grid-template-columns:1fr}.console{position:absolute;right:15px;bottom:84px;z-index:10;background:transparent;border:0;box-shadow:none}.action{min-width:64px;height:42px;padding:0 8px;background:#061b10}.nav{gap:2px}.zone{min-height:58px}.zone .z{font-size:.57rem}.mission{top:10px}.hint{display:none}.object{width:46px;height:46px}.mech{right:10px;bottom:135px;width:145px}.reactor:before{width:190px}}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<main class="shell">
  <header class="top">
    <div class="brand"><b>THE MATRIX</b><small>RAINSHIP // SIGNAL INTERCEPTOR</small></div>
    <div class="status" aria-label="Ship status">
      <div class="stat"><div class="label">HULL</div><div class="value" id="hullText">100%</div><div class="meter"><i id="hullBar" style="width:100%"></i></div></div>
      <div class="stat"><div class="label">CODE</div><div class="value" id="codeText">000</div></div>
      <div class="stat"><div class="label">CHAIN</div><div class="value" id="chainText">×1</div></div>
    </div>
  </header>
  <section class="stage" id="stage" aria-label="Current Matrix zone">
    <div class="roomfx bridge" id="roomfx"></div><div class="horizon"></div><div class="scene"><div class="portal"></div></div>
    <aside class="mission"><b id="zoneTitle">01 // COMMAND BRIDGE</b><p id="zoneStory"></p><em id="objective"></em><div class="capacity"><i id="capacityBar"></i></div></aside>
    <div class="hint">TAP RELICS BEFORE<br>THE RAIN CORRUPTS THEM<br><button class="rain-toggle" id="rainToggle">RAIN: ACTIVE</button></div>
    <div class="mech"><b id="mechName"></b><span id="mechText"></span></div><div class="warning" id="warning"></div>
    <div class="toast" id="toast" role="status"></div>
  </section>
  <footer class="controls">
    <nav class="nav" id="nav" aria-label="Ship zones"></nav>
    <div class="console"><button class="action" id="program">PROGRAM</button><button class="action" id="pulse">EMP PULSE</button><button class="action" id="repair">REPAIR</button></div>
  </footer>
</main>
<script>
(()=>{
const zones=[
 {name:'COMMAND BRIDGE',room:'bridge',story:'Route five live command programs while the forward glass leaks code rain.',goal:5,color:'#35ff8a',program:'VECTOR ROUTING',mechanic:'HTML input + live navigation logic',items:['NAV CORE','RED KEY','UPLINK','VECTOR','CAPTAIN']},
 {name:'GRAVITY HANGAR',room:'hangar',story:'The hovercraft bay has lost gravity. Catch drifting flight modules before impact.',goal:7,color:'#3cecff',program:'ZERO-G PHYSICS',mechanic:'Canvas motion + touch collision',items:['THRUSTER','GYRO','WING','LIFT','BRAKE','PILOT','DOCK']},
 {name:'CODE FORGE',room:'forge',story:'The fabrication furnace prints hostile programs. Purge bad code and harvest cores.',goal:8,color:'#ff4066',program:'FIREWALL PURGE',mechanic:'Particles + timed hazard pressure',items:['CIPHER','KERNEL','SHIELD','PATCH','DAEMON','STACK','BYTE','ROOT']},
 {name:'TRAINING HOLODECK',room:'holodeck',story:'The room duplicates every target. Memorize the real sequence through the flicker.',goal:9,color:'#ffc83c',program:'MIRROR REVEAL',mechanic:'DOM cloning + visual state memory',items:['STANCE','FOCUS','DODGE','STRIKE','ECHO','MIRROR','BREATH','SPEED','CALM']},
 {name:'SOURCE REACTOR',room:'reactor',story:'The ship’s impossible heart is compiling reality. Stabilize every choice at once.',goal:10,color:'#d78cff',program:'REALITY BEND',mechanic:'Layered canvas + program synthesis',items:['CHOICE','ORACLE','DOOR','VOID','LIGHT','TIME','SELF','TRUTH','SOURCE','ONE']}
];
const icons={
 key:'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PGNpcmNsZSBjeD0iMjAiIGN5PSIyMiIgcj0iMTIiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmZjAwMCIgc3Ryb2tlLXdpZHRoPSI2Ii8+PHBhdGggZD0iTTI5IDMwTDU0IDU1TTQyIDQybDgtOE01MCA1MGw4LTgiIHN0cm9rZT0iI2ZmZjAwMCIgc3Ryb2tlLXdpZHRoPSI2Ii8+PC9zdmc+',
 chip:'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3QgeD0iMTQiIHk9IjE0IiB3aWR0aD0iMzYiIGhlaWdodD0iMzYiIHJ4PSI0IiBmaWxsPSJub25lIiBzdHJva2U9IiMzNWZmOGEiIHN0cm9rZS13aWR0aD0iNCIvPjxwYXRoIGQ9Ik0yMiAyMnYyMGgyMFYyMnpNMCAyNGgxNE0wIDQwaDE0TTY0IDI0SDUwTTY0IDQwSDUwTTI0IDB2MTRNNDAgMHYxNE0yNCA2NHYtMTRNNDAgNjR2LTE0IiBzdHJva2U9IiMzNWZmOGEiIHN0cm9rZS13aWR0aD0iNCIvPjwvc3ZnPg==',
 orb:'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PGRlZnM+PHJhZGlhbEdyYWRpZW50IGlkPSJnIj48c3RvcCBzdG9wLWNvbG9yPSIjZmZmIi8+PHN0b3Agb2Zmc2V0PSIuMzUiIHN0b3AtY29sb3I9IiMzY2VjZmYiLz48c3RvcCBvZmZzZXQ9IjEiIHN0b3AtY29sb3I9IiMwMDIyMzMiLz48L3JhZGlhbEdyYWRpZW50PjwvZGVmcz48Y2lyY2xlIGN4PSIzMiIgY3k9IjMyIiByPSIyNiIgZmlsbD0idXJsKCNnKSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIiLz48L3N2Zz4='};
let zone=0,unlocked=0,hull=100,code=0,chain=1,remaining=[],rainOn=true,pulseReady=true,programReady=true,raf,last=0,storm=1;
const $=s=>document.querySelector(s),stage=$('#stage'),nav=$('#nav'),toast=$('#toast');
function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),1100)}
function renderNav(){nav.innerHTML=zones.map((z,i)=>`<button class="zone ${i===zone?'on':''} ${i>unlocked?'lock':''}" data-i="${i}" aria-label="Zone ${i+1}, ${z.name}${i>unlocked?', locked':''}"><span class="n">0${i+1}</span><span class="z">${z.name.split(' ')[0]}</span></button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(i>unlocked)return say('ZONE LOCKED');zone=i;loadZone()})}
function loadZone(){let z=zones[zone];document.documentElement.style.setProperty('--g',z.color);$('#zoneTitle').textContent=`0${zone+1} // ${z.name}`;$('#zoneStory').textContent=z.story;$('#roomfx').className='roomfx '+z.room;$('#mechName').textContent=z.program;$('#mechText').textContent=z.mechanic;remaining=[...z.items];storm=1+zone*.35;spawn();renderNav();update()}
function spawn(){stage.querySelectorAll('.object').forEach(x=>x.remove());remaining.forEach((name,i)=>{let o=document.createElement('button');o.className='object';o.style.color=zones[zone].color;o.style.left=`${10+(i*61)%78}%`;o.style.top=`${29+(i*43)%50}%`;o.style.animationDelay=`-${i*.31}s`;o.innerHTML=`<img alt="" src="${i%3===0?icons.key:i%3===1?icons.chip:icons.orb}"><span>${name}</span>`;o.dataset.name=name;o.dataset.i=i;o.onclick=()=>collect(o);if(zone===1){o.animate([{transform:'translate(-12px,-20px) rotate(-8deg)'},{transform:'translate(16px,18px) rotate(12deg)'}],{duration:1900+i*180,direction:'alternate',iterations:Infinity,easing:'ease-in-out'})}if(zone===3&&i%2){let clone=o.cloneNode(true);clone.style.opacity='.3';clone.style.filter='blur(2px)';clone.onclick=()=>{hull-=8;chain=1;flash();say('FALSE HOLOGRAM');clone.remove();update()};stage.appendChild(clone)}stage.appendChild(o)})}
function collect(o){if(o.classList.contains('got'))return;o.classList.add('got');let n=o.dataset.name;remaining=remaining.filter(x=>x!==n);code+=10*chain;chain=Math.min(9,chain+1);hull=Math.min(100,hull+2);say(`+${10*(chain-1)} CODE // ${n}`);setTimeout(()=>o.remove(),450);if(!remaining.length)setTimeout(clearZone,550);update()}
function clearZone(){code+=100*(zone+1);say('ZONE STABILIZED');if(zone<4){unlocked=Math.max(unlocked,zone+1);setTimeout(()=>{zone++;loadZone()},950)}else{setTimeout(()=>{say('THE RAIN ANSWERS TO YOU');remaining=[...zones[4].items];spawn()},1200)}update()}
function flash(){let w=$('#warning');w.classList.add('hit');setTimeout(()=>w.classList.remove('hit'),160)}
function update(){hull=Math.max(0,Math.round(hull));$('#hullText').textContent=hull+'%';$('#hullBar').style.width=hull+'%';$('#hullBar').style.background=hull<30?'var(--danger)':'var(--g)';$('#codeText').textContent=String(code).padStart(3,'0');$('#chainText').textContent='×'+chain;let done=zones[zone].goal-remaining.length;$('#objective').textContent=remaining.length?`PROGRAM CAPACITY ${done} / ${zones[zone].goal}`:'ROOM STABLE';$('#capacityBar').style.width=(done/zones[zone].goal*100)+'%';if(hull<=0){hull=100;chain=1;code=Math.max(0,code-100);say('SHIP SYSTEM REBOOT');spawn()}}
$('#program').onclick=()=>{if(!programReady)return;programReady=false;$('#program').disabled=true;let objs=[...stage.querySelectorAll('.object:not(.got)')];if(zone===0){objs.forEach((o,i)=>{o.style.left=(12+(i*17)%75)+'%';o.style.top=(34+(i%2)*28)+'%'});say('ROUTE CALCULATED')}if(zone===1){objs.forEach(o=>o.getAnimations().forEach(a=>a.pause()));say('GRAVITY ANCHORED')}if(zone===2){storm=.2;code+=25;say('FIREWALL PURGE ACTIVE')}if(zone===3){objs.filter(o=>+o.dataset.i%2).forEach(o=>{if(o.style.opacity==='.3')o.remove()});say('TRUE TARGETS REVEALED')}if(zone===4){rainOn=false;objs.forEach((o,i)=>o.style.transform=`rotate(${i*36}deg) translateY(-18px)`);say('REALITY PAUSED')}update();setTimeout(()=>{programReady=true;$('#program').disabled=false;storm=1+zone*.35;if(zone===1)objs.forEach(o=>o.getAnimations().forEach(a=>a.play()));if(zone===4)rainOn=true},3500)};
$('#pulse').onclick=()=>{if(!pulseReady)return;pulseReady=false;$('#pulse').disabled=true;code=Math.max(0,code-15);chain=1;drops.forEach(d=>d.y=-Math.random()*innerHeight);say('RAIN DISRUPTED');update();setTimeout(()=>{pulseReady=true;$('#pulse').disabled=false},4500)};
$('#repair').onclick=()=>{if(code<30)return say('30 CODE REQUIRED');code-=30;hull=Math.min(100,hull+35);say('HULL RESTORED');update()};
$('#rainToggle').onclick=()=>{rainOn=!rainOn;$('#rainToggle').textContent='RAIN: '+(rainOn?'ACTIVE':'PAUSED')};
const c=$('#rain'),ctx=c.getContext('2d'),glyphs='01アイウエオカキクケコZX∆◊',drops=[];let fs=16,cols=0;
function resize(){let d=Math.min(2,devicePixelRatio||1);c.width=innerWidth*d;c.height=innerHeight*d;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0);cols=Math.ceil(innerWidth/fs);drops.length=0;for(let i=0;i<cols;i++)drops.push({x:i*fs,y:Math.random()*innerHeight,s:2+Math.random()*6})}addEventListener('resize',resize);resize();
function splash(x,y,color){for(let i=0;i<5;i++){ctx.fillStyle=color;ctx.globalAlpha=.65;ctx.fillRect(x+(Math.random()-.5)*18,y+Math.random()*8,2,2)}}
function loop(t){let dt=Math.min(35,t-last||16);last=t;ctx.fillStyle='rgba(0,5,2,.13)';ctx.fillRect(0,0,innerWidth,innerHeight);if(rainOn){ctx.font=fs+'px monospace';drops.forEach((d,i)=>{ctx.globalAlpha=.35+Math.random()*.5;ctx.fillStyle=i%9===0?'#eafff1':zones[zone].color;ctx.fillText(glyphs[(Math.random()*glyphs.length)|0],d.x,d.y);d.y+=d.s*storm*dt/16;if(d.y>innerHeight+30)d.y=-20;stage.querySelectorAll('.object:not(.got)').forEach(o=>{let q=o.getBoundingClientRect();if(d.x>q.left&&d.x<q.right&&d.y>q.top&&d.y<q.bottom){splash(d.x,d.y,zones[zone].color);d.y=-20;if(Math.random()<.008*storm){hull-=zone===2?2:1;chain=1;flash();update()}}})})}ctx.globalAlpha=1;raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);
loadZone();
})();
</script>
</body>
</html>
